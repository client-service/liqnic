# CircleCI Root Configuration (v17 - Multi-Config Dispatcher)
# This file acts as a simple dispatcher. It detects which service's path has
# changed and triggers the respective CircleCI configuration file located
# within that service's directory.
version: 2.1

# This key explicitly enables Dynamic Configuration, allowing this
# config to trigger other pipeline configurations.
setup: true

orbs:
  path-filtering: circleci/path-filtering@2.0.4

workflows:
  # This is the only workflow in the root config.
  trigger-service-pipelines:
    jobs:
      # This job checks for changes in the 'backend' directory.
      - path-filtering/filter:
          name: filter-backend-changes
          base-revision: main
          config-path: backend/.circleci/config.yml
          mapping: |
            backend/.* true
          filters:
            branches:
              only:
                - development
                - production

      # This job checks for changes in the 'dashboard' directory.
      - path-filtering/filter:
          name: filter-dashboard-changes
          base-revision: main
          config-path: dashboard/.circleci/config.yml
          mapping: |
            dashboard/.* true
          filters:
            branches:
              only:
                - development
                - production