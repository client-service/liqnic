# CircleCI Configuration for MedusaJS Monorepo (v14 - Final)
# This configuration is complete and includes all requested features.
# Schema Fix: The 'when' condition is not supported on steps within a reusable command.
# The save_cache logic has been moved from the 'install_dependencies' command
# into the individual jobs to resolve the schema violation error.
version: 2.1

# Orbs are reusable packages of CircleCI configuration.
orbs:
  path-filtering: circleci/path-filtering@2.0.4
  docker: circleci/docker@3.0.1

# Pipeline parameters are set by the path-filtering orb at the start of the workflow.
parameters:
  build-backend:
    type: boolean
    default: false
  build-dashboard:
    type: boolean
    default: false

# Reusable execution environment for Node.js jobs.
executors:
  node_executor:
    docker:
      - image: cimg/node:22.4

# Reusable command to install dependencies with caching.
commands:
  install_dependencies:
    parameters:
      project_path:
        type: string
      package_manager:
        type: enum
        enum: ["npm", "yarn"]
    steps:
      - restore_cache:
          keys:
            - v1-deps-yarn-<< parameters.project_path >>-{{ checksum "<< parameters.project_path >>/yarn.lock" }}
            - v1-deps-npm-<< parameters.project_path >>-{{ checksum "<< parameters.project_path >>/package-lock.json" }}
            - v1-deps-<< parameters.project_path >>-
      - run:
          name: Install dependencies for << parameters.project_path >>
          working_directory: << parameters.project_path >>
          command: << parameters.package_manager >> install

jobs:
  # == TEST & BUILD JOBS ==
  test_and_build_backend:
    executor: node_executor
    steps:
      - run:
          name: Check if job should run
          command: |
            if [ "<< pipeline.parameters.build-backend >>" != "true" ]; then
              echo "Skipping job: No changes detected in the backend."
              circleci-agent step halt
            fi
      - checkout
      - install_dependencies: { project_path: backend, package_manager: yarn }
      - save_cache:
          key: v1-deps-yarn-backend-{{ checksum "backend/yarn.lock" }}
          paths:
            - backend/node_modules
      - run: { name: "Build Backend", working_directory: backend, command: "npm run build" }

  test_and_build_dashboard:
    executor: node_executor
    steps:
      - run:
          name: Check if job should run
          command: |
            if [ "<< pipeline.parameters.build-dashboard >>" != "true" ]; then
              echo "Skipping job: No changes detected in the dashboard."
              circleci-agent step halt
            fi
      - checkout
      - install_dependencies: { project_path: dashboard, package_manager: npm }
      - save_cache:
          key: v1-deps-npm-dashboard-{{ checksum "dashboard/package-lock.json" }}
          paths:
            - dashboard/node_modules
      - run: { name: "Build Dashboard", working_directory: dashboard, command: "npm run build" }

  # == DEDICATED DOCKER BUILD & PUSH JOBS ==
  build_and_push_backend_dev:
    executor: node_executor
    steps:
      - run:
          name: Check if job should run
          command: |
            if [ "<< pipeline.parameters.build-backend >>" != "true" ] || [ "$CIRCLE_BRANCH" != "develop" ]; then
              echo "Skipping job: Conditions not met (no backend changes or not on develop branch)."
              circleci-agent step halt
            fi
      - checkout
      - setup_remote_docker: { version: 20.10.18 }
      - docker/check
      - run: { name: "Log in to Docker Hub", command: "echo \"$DOCKER_PASSWORD\" | docker login -u \"$DOCKER_USERNAME\" --password-stdin" }
      - run:
          name: Build and Push Backend Dev Image
          working_directory: backend
          command: |
            docker build -t "$DOCKER_USERNAME/medusa-backend:dev-${CIRCLE_SHA1:0:7}" .
            docker tag "$DOCKER_USERNAME/medusa-backend:dev-${CIRCLE_SHA1:0:7}" "$DOCKER_USERNAME/medusa-backend:dev"
            docker push "$DOCKER_USERNAME/medusa-backend" --all-tags

  build_and_push_backend_prod:
    executor: node_executor
    steps:
      - run:
          name: Check if job should run
          command: |
            if [ "<< pipeline.parameters.build-backend >>" != "true" ] || [ "$CIRCLE_BRANCH" != "main" ]; then
              echo "Skipping job: Conditions not met (no backend changes or not on main branch)."
              circleci-agent step halt
            fi
      - checkout
      - setup_remote_docker: { version: 20.10.18 }
      - docker/check
      - run: { name: "Log in to Docker Hub", command: "echo \"$DOCKER_PASSWORD\" | docker login -u \"$DOCKER_USERNAME\" --password-stdin" }
      - run:
          name: Build and Push Backend Prod Image
          working_directory: backend
          command: |
            docker build -t "$DOCKER_USERNAME/medusa-backend:prod-${CIRCLE_SHA1:0:7}" .
            docker tag "$DOCKER_USERNAME/medusa-backend:prod-${CIRCLE_SHA1:0:7}" "$DOCKER_USERNAME/medusa-backend:prod"
            docker push "$DOCKER_USERNAME/medusa-backend" --all-tags

  build_and_push_dashboard_dev:
    executor: node_executor
    steps:
      - run:
          name: Check if job should run
          command: |
            if [ "<< pipeline.parameters.build-dashboard >>" != "true" ] || [ "$CIRCLE_BRANCH" != "develop" ]; then
              echo "Skipping job: Conditions not met (no dashboard changes or not on develop branch)."
              circleci-agent step halt
            fi
      - checkout
      - setup_remote_docker: { version: 20.10.18 }
      - docker/check
      - run: { name: "Log in to Docker Hub", command: "echo \"$DOCKER_PASSWORD\" | docker login -u \"$DOCKER_USERNAME\" --password-stdin" }
      - run:
          name: Build and Push Dashboard Dev Image
          working_directory: dashboard
          command: |
            echo "Creating .env file for dashboard build..."
            echo "VITE_MEDUSA_BACKEND_URL=${DASHBOARD_VITE_MEDUSA_BACKEND_URL}" > .env
            echo "VITE_MEDUSA_BASE=${DASHBOARD_VITE_MEDUSA_BASE}" >> .env
            echo "VITE_MEDUSA_STOREFRONT_URL=${DASHBOARD_VITE_MEDUSA_STOREFRONT_URL}" >> .env
            docker build -t "$DOCKER_USERNAME/medusa-dashboard:dev-${CIRCLE_SHA1:0:7}" .
            docker tag "$DOCKER_USERNAME/medusa-dashboard:dev-${CIRCLE_SHA1:0:7}" "$DOCKER_USERNAME/medusa-dashboard:dev"
            docker push "$DOCKER_USERNAME/medusa-dashboard" --all-tags

  build_and_push_dashboard_prod:
    executor: node_executor
    steps:
      - run:
          name: Check if job should run
          command: |
            if [ "<< pipeline.parameters.build-dashboard >>" != "true" ] || [ "$CIRCLE_BRANCH" != "main" ]; then
              echo "Skipping job: Conditions not met (no dashboard changes or not on main branch)."
              circleci-agent step halt
            fi
      - checkout
      - setup_remote_docker: { version: 20.10.18 }
      - docker/check
      - run: { name: "Log in to Docker Hub", command: "echo \"$DOCKER_PASSWORD\" | docker login -u \"$DOCKER_USERNAME\" --password-stdin" }
      - run:
          name: Build and Push Dashboard Prod Image
          working_directory: dashboard
          command: |
            echo "Creating .env file for dashboard build..."
            echo "VITE_MEDUSA_BACKEND_URL=${DASHBOARD_VITE_MEDUSA_BACKEND_URL}" > .env
            echo "VITE_MEDUSA_BASE=${DASHBOARD_VITE_MEDUSA_BASE}" >> .env
            echo "VITE_MEDUSA_STOREFRONT_URL=${DASHBOARD_VITE_MEDUSA_STOREFRONT_URL}" >> .env
            docker build -t "$DOCKER_USERNAME/medusa-dashboard:prod-${CIRCLE_SHA1:0:7}" .
            docker tag "$DOCKER_USERNAME/medusa-dashboard:prod-${CIRCLE_SHA1:0:7}" "$DOCKER_USERNAME/medusa-dashboard:prod"
            docker push "$DOCKER_USERNAME/medusa-dashboard" --all-tags

  # == DEPLOYMENT JOBS ==
  deploy_to_dev:
    machine: { image: ubuntu-2204:2023.07.2 }
    steps:
      - run:
          name: Check if job should run
          command: |
            if [ "$CIRCLE_BRANCH" != "develop" ]; then
              echo "Skipping dev deployment: Not on develop branch."
              circleci-agent step halt
            fi
            if [ "<< pipeline.parameters.build-backend >>" != "true" ] && [ "<< pipeline.parameters.build-dashboard >>" != "true" ]; then
              echo "Skipping dev deployment: No changes to deploy."
              circleci-agent step halt
            fi
      - run: { name: "Install sshpass", command: "sudo apt-get update && sudo apt-get install -y sshpass" }
      - run:
          name: Deploy to Dev
          command: |
            SSH_COMMAND="sshpass -p '$SSH_PASSWORD' ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
            $SSH_COMMAND "
              set -e
              cd /home/docker/liqnic/dev
              docker-compose pull
              docker-compose up -d --remove-orphans
              docker image prune -af
              echo '==> Deployment to dev complete!'
            "

  deploy_to_prod:
    machine: { image: ubuntu-2204:2023.07.2 }
    steps:
      - run: { name: "Install sshpass", command: "sudo apt-get update && sudo apt-get install -y sshpass" }
      - run:
          name: Deploy to Prod
          command: |
            SSH_COMMAND="sshpass -p '$SSH_PASSWORD' ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
            $SSH_COMMAND "
              set -e
              cd /home/docker/liqnic/prod
              docker-compose pull
              docker-compose up -d --remove-orphans
              docker image prune -af
              echo '==> Deployment to prod complete!'
            "

workflows:
  commit-pipeline:
    jobs:
      - path-filtering/filter:
          name: check-for-changes
          base-revision: main
          mapping: |
            backend/.* build-backend true
            dashboard/.* build-dashboard true

      - test_and_build_backend:
          requires: [check-for-changes]

      - test_and_build_dashboard:
          requires: [check-for-changes]

      - build_and_push_backend_dev:
          context: liqnic-dev
          requires: [test_and_build_backend]

      - build_and_push_backend_prod:
          context: liqnic-prod
          requires: [test_and_build_backend]

      - build_and_push_dashboard_dev:
          context: liqnic-dev
          requires: [test_and_build_dashboard]

      - build_and_push_dashboard_prod:
          context: liqnic-prod
          requires: [test_and_build_dashboard]

      - deploy_to_dev:
          context: liqnic-dev
          requires:
            - build_and_push_backend_dev
            - build_and_push_dashboard_dev

      - hold_for_prod_approval:
          type: approval
          requires:
            - build_and_push_backend_prod
            - build_and_push_dashboard_prod

      - deploy_to_prod:
          context: liqnic-prod
          requires: [hold_for_prod_approval]

