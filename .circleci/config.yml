# CircleCI Root Configuration (v26 - Final Schema Fix)
# This configuration uses two dedicated trigger jobs instead of one
# reusable job to resolve the final linter schema violations.
version: 2.1

# This key explicitly enables Dynamic Configuration.
setup: true

orbs:
  path-filtering: circleci/path-filtering@2.0.4
  continuation: circleci/continuation@2.0.1

# Define pipeline parameters that the path-filtering orb will populate.
parameters:
  build-backend:
    type: boolean
    default: false
  build-dashboard:
    type: boolean
    default: false

# Define separate, dedicated jobs for each pipeline trigger.
jobs:
  # This job's only purpose is to trigger the backend pipeline if its parameter is true.
  trigger-backend-pipeline:
    docker:
      - image: cimg/base:current
    steps:
      - when:
          condition: << pipeline.parameters.build-backend >>
          steps:
            - continuation/continue:
                configuration_path: backend/.circleci/config.yml

  # This job's only purpose is to trigger the dashboard pipeline if its parameter is true.
  trigger-dashboard-pipeline:
    docker:
      - image: cimg/base:current
    steps:
      - when:
          condition: << pipeline.parameters.build-dashboard >>
          steps:
            - continuation/continue:
                configuration_path: dashboard/.circleci/config.yml

workflows:
  # This workflow checks for changes and triggers the appropriate service pipeline.
  check-and-trigger:
    jobs:
      # This job runs first and sets the pipeline parameters defined above.
      - path-filtering/filter:
          name: check-changes
          mapping: |
            backend/.* build-backend true
            dashboard/.* build-dashboard true
          base-revision: main
          filters:
            branches:
              only:
                - development
                - production

      # Call the dedicated backend trigger job. It will internally decide whether to run.
      - trigger-backend-pipeline:
          requires:
            - check-changes

      # Call the dedicated dashboard trigger job.
      - trigger-dashboard-pipeline:
          requires:
            - check-changes

