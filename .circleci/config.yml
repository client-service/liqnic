# CircleCI Root Configuration (v31 - Two-File Setup)
# This file is a simple dispatcher. Its only job is to run the
# path-filtering orb, which will then trigger the pipeline defined in
# the 'continue_config.yml' file with the correct parameters.
version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@2.0.4

workflows:
  check-for-changes:
    jobs:
      - path-filtering/filter:
          # This parameter points the orb to the file that contains the rest of our pipeline logic.
          config-path: .circleci/continue_config.yml
          base-revision: main
          mapping: |
            backend/.* build-backend true
            dashboard/.* build-dashboard true
          filters:
            branches:
              only:
                - development
                - production

