# CircleCI Root Configuration (v17 - Multi-Config Dispatcher)
# This file acts as a simple dispatcher. It detects which service's path has
# changed and triggers the respective CircleCI configuration file located
# within that service's directory.
version: 2.1

orbs:
  path-filtering: circleci/path-filtering@2.0.4

workflows:
  # This is the only workflow that runs initially. Its sole purpose is to
  # check for changes and trigger the appropriate downstream pipeline.
  check-for-changes:
    jobs:
      - path-filtering/filter:
          base-revision: main
          # The mapping determines which config file to use for the pipeline continuation.
          mapping: |
            backend/.* backend/.circleci/config.yml
            dashboard/.* dashboard/.circleci/config.yml

