# Unified Monorepo CI/CD Pipeline
# This single file manages the build and deployment for both the backend and dashboard services.
# It runs the full pipeline for every commit on the 'development' and 'production' branches.
version: 2.1

jobs:
  # ====================================================================
  # ==                         BACKEND JOBS                         ==
  # ====================================================================
  build-and-test-backend:
    docker:
      - image: cimg/node:22.4
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-yarn-{{ checksum "backend/yarn.lock" }}
            - v1-deps-yarn-
      - run:
          name: "Install Backend Dependencies"
          working_directory: backend
          # Use --frozen-lockfile to prevent modifications to yarn.lock in CI
          command: "yarn install --frozen-lockfile"
      - save_cache:
          key: v1-deps-yarn-{{ checksum "backend/yarn.lock" }}
          paths:
            - "backend/node_modules"
            - "backend/.yarn/cache"
      - run:
          name: "Build Backend"
          working_directory: backend
          command: "yarn build"

  docker-build-and-publish-backend:
    docker:
      - image: cimg/node:22.4
        auth:
          username: $DOCKER_USERNAME
          password: $DOCKER_PASSWORD
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and Push Backend Docker Image
          working_directory: backend
          command: |
            if [ "$CIRCLE_BRANCH" = "development" ]; then
              STATIC_TAG="dev"
            elif [ "$CIRCLE_BRANCH" = "production" ]; then
              STATIC_TAG="prod"
            fi
            UNIQUE_TAG="$STATIC_TAG-$CIRCLE_BUILD_NUM"
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker build -t "$DOCKER_USERNAME/liqnic-backend:$UNIQUE_TAG" .
            docker tag "$DOCKER_USERNAME/liqnic-backend:$UNIQUE_TAG" "$DOCKER_USERNAME/liqnic-backend:$STATIC_TAG"
            docker push --all-tags "$DOCKER_USERNAME/liqnic-backend"

  deploy-backend:
    machine:
      image: ubuntu-2204:current
    steps:  
      - run:
          name: Check if container exists
          command: |
            if [ "$CIRCLE_BRANCH" = "development" ]; then
              STATIC_TAG="dev"
              CONTAINER_NAME="liqnic-backend-dev"
            elif [ "$CIRCLE_BRANCH" = "production" ]; then
              STATIC_TAG="prod"
              CONTAINER_NAME="liqnic-backend-prod"
            fi
            SSH_COMMAND="ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
            $SSH_COMMAND "
            if docker ps -a --format '{{.Names}}' | grep -q "${CONTAINER_NAME}"; then
              echo "Container liqnic-backend exists"
              docker stop $CONTAINER_NAME
              docker rm $CONTAINER_NAME
              docker rmi $DOCKER_USERNAME/liqnic-backend:$STATIC_TAG
              echo "Container liqnic-backend stopped and removed"
            else
              echo "Container liqnic-backend does not exist"
            fi"
            
      - run:
          name: Deploy Backend to Environment
          command: |
            if [ "$CIRCLE_BRANCH" = "development" ]; then
              DEPLOY_PATH="/home/docker/liqnic/dev"
            elif [ "$CIRCLE_BRANCH" = "production" ]; then
              DEPLOY_PATH="/home/docker/liqnic/prod"
            fi
            SSH_COMMAND="ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
            $SSH_COMMAND "
              set -e
              cd $DEPLOY_PATH
              docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
              docker compose up -d backend
              echo '==> Backend deployment complete!'
            "

  # ====================================================================
  # ==                        DASHBOARD JOBS                        ==
  # ====================================================================
  build-and-test-dashboard:
    docker:
      - image: cimg/node:22.4
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-npm-{{ checksum "dashboard/package-lock.json" }}
            - v1-deps-npm-
      - run:
          name: "Install Dashboard Dependencies"
          working_directory: dashboard
          # Use 'npm ci' for faster, more reliable installs in CI environments.
          command: "npm ci"
      - save_cache:
          key: v1-deps-npm-{{ checksum "dashboard/package-lock.json" }}
          paths:
            - "dashboard/node_modules"
            - "~/.npm"
      - run:
          name: "Build Dashboard"
          working_directory: dashboard
          command: "npm run build"

  docker-build-and-publish-dashboard:
    docker:
      - image: cimg/node:22.4
        auth:
          username: $DOCKER_USERNAME
          password: $DOCKER_PASSWORD
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and Push Dashboard Docker Image
          working_directory: dashboard
          command: |
            if [ "$CIRCLE_BRANCH" = "development" ]; then
              STATIC_TAG="dev"
            elif [ "$CIRCLE_BRANCH" = "production" ]; then
              STATIC_TAG="prod"
            fi
            UNIQUE_TAG="$STATIC_TAG-$CIRCLE_BUILD_NUM"
            echo "VITE_MEDUSA_BACKEND_URL=${DASHBOARD_VITE_MEDUSA_BACKEND_URL}" > .env
            echo "VITE_MEDUSA_BASE=${DASHBOARD_VITE_MEDUSA_BASE}" >> .env
            echo "VITE_MEDUSA_STOREFRONT_URL=${DASHBOARD_VITE_MEDUSA_STOREFRONT_URL}" >> .env
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker build -t "$DOCKER_USERNAME/liqnic-dashboard:$UNIQUE_TAG" .
            docker tag "$DOCKER_USERNAME/liqnic-dashboard:$UNIQUE_TAG" "$DOCKER_USERNAME/liqnic-dashboard:$STATIC_TAG"
            docker push --all-tags "$DOCKER_USERNAME/liqnic-dashboard"

  deploy-dashboard:
    machine:
      image: ubuntu-2204:current
    steps:  
      - run:
          name: Check if container exists
          command: |
            if [ "$CIRCLE_BRANCH" = "development" ]; then
              STATIC_TAG="dev"
              CONTAINER_NAME="liqnic-dashboard-dev"
            elif [ "$CIRCLE_BRANCH" = "production" ]; then
              STATIC_TAG="prod"
              CONTAINER_NAME="liqnic-dashboard-prod"
            fi
            SSH_COMMAND="ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
            $SSH_COMMAND "
            if docker ps -a --format '{{.Names}}' | grep -q "${CONTAINER_NAME}"; then
              echo "Container liqnic-dashboard exists"
              docker stop $CONTAINER_NAME
              docker rm $CONTAINER_NAME
              docker rmi $DOCKER_USERNAME/liqnic-dashboard:$STATIC_TAG
              echo "Container liqnic-dashboard stopped and removed"
            else
              echo "Container liqnic-dashboard does not exist"
            fi"
            
      - run:
          name: Deploy Dashboard to Environment
          command: |
            if [ "$CIRCLE_BRANCH" = "development" ]; then
              DEPLOY_PATH="/home/docker/liqnic/dev"
            elif [ "$CIRCLE_BRANCH" = "production" ]; then
              DEPLOY_PATH="/home/docker/liqnic/prod"
            fi
            SSH_COMMAND="ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST"
            $SSH_COMMAND "
              set -e
              cd $DEPLOY_PATH
              docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
              docker compose up -d dashboard
              echo '==> Dashboard deployment complete!'
            "

# ====================================================================
# ==                         WORKFLOWS                            ==
# ====================================================================
workflows:
  build-and-deploy:
    jobs:
      # Run build and test jobs in parallel
      - build-and-test-backend:
          filters:
            branches:
              only:
                - development
                - production
      - build-and-test-dashboard:
          filters:
            branches:
              only:
                - development
                - production

      # Run Docker publish jobs in parallel after tests pass
      - docker-build-and-publish-backend:
          requires:
            - build-and-test-backend
          filters:
            branches:
              only:
                - development
                - production

      - docker-build-and-publish-dashboard:
          context: [ liqnic-dev, liqnic-prod ]
          requires:
            - build-and-test-dashboard
          filters:
            branches:
              only:
                - development
                - production

      # Deploy both services in parallel after their images are published
      - deploy-backend:
          requires:
            - docker-build-and-publish-backend
          filters:
            branches:
              only:
                - development
                - production

      - deploy-dashboard:
          requires:
            - docker-build-and-publish-dashboard
          filters:
            branches:
              only:
                - development
                - production
