version: 2.1

# This tells CircleCI: "Wait, don't run jobs yet. I need to calculate paths first."
setup: true

orbs:
  # The official CircleCI orb for monorepo path routing
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  setup-monorepo-workflow:
    jobs:
      - path-filtering/filter:
          name: route-traffic
          mapping: |
            backend/.* run-backend-pipeline true
            dashboard/.* run-dashboard-pipeline true
            storefront/.* run-storefront-pipeline true
            pnpm-lock.yaml run-backend-pipeline true
            pnpm-lock.yaml run-dashboard-pipeline true
            pnpm-lock.yaml run-storefront-pipeline true
            ^\.circleci/.* run-backend-pipeline true
            ^\.circleci/.* run-dashboard-pipeline true
            ^\.circleci/.* run-storefront-pipeline true
            ^package\.json$ run-backend-pipeline true
            ^package\.json$ run-dashboard-pipeline true
            ^package\.json$ run-storefront-pipeline true
            ^pnpm-workspace\.yaml$ run-backend-pipeline true
            ^pnpm-workspace\.yaml$ run-dashboard-pipeline true
            ^pnpm-workspace\.yaml$ run-storefront-pipeline true
            ^docker-compose\.yml$ run-backend-pipeline true
            ^docker-compose\.yml$ run-dashboard-pipeline true
            ^docker-compose\.yml$ run-storefront-pipeline true
          # Compare against the previous commit, not 'main'
          base-revision: << pipeline.git.base_revision >>
          # This line tells CircleCI to hand off execution to your heavy lifter
          config-path: .circleci/continue_config.yml
          # Only run on branches where builds/deploys actually happen.
          # Feature branches have no prior tip on first push, so
          # pipeline.git.base_revision is empty → orb crashes with
          # "empty string is not a valid pathspec". Filtering here
          # ensures base_revision is always populated when we run.
          filters:
            branches:
              only:
                - development
                - production