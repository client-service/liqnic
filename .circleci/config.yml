version: 2.1

# This tells CircleCI: "Wait, don't run jobs yet. I need to calculate paths first."
setup: true

orbs:
  # The official CircleCI orb for monorepo path routing
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  setup-monorepo-workflow:
    jobs:
      - path-filtering/filter:
          name: route-traffic
          mapping: |
            backend/.* run-backend-pipeline true
            dashboard/.* run-dashboard-pipeline true
            storefront/.* run-storefront-pipeline true
            yarn.lock run-backend-pipeline true
            yarn.lock run-dashboard-pipeline true
            yarn.lock run-storefront-pipeline true
          # Compare against the previous commit, not 'main'
          base-revision: << pipeline.git.base_revision >>
          # This line tells CircleCI to hand off execution to your heavy lifter
          config-path: .circleci/continue_config.yml