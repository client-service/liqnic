version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/node:22.6

commands:
  check_changes:
    description: "Check if files in a directory changed"
    parameters:
      dir:
        type: string
    steps:
      - run:
          name: Check changes in << parameters.dir >>
          command: |
            if git diff --quiet HEAD~1 HEAD ./<< parameters.dir >>; then
              echo "false" > .changed_<< parameters.dir >>
            else
              echo "true" > .changed_<< parameters.dir >>
            fi

  build_and_cache_node:
    description: "Install & build Node project with cache"
    parameters:
      dir:
        type: string
      lockfile:
        type: string
      install_cmd:
        type: string
      build_cmd:
        type: string
    steps:
      - restore_cache:
          keys:
            - v1-<< parameters.dir >>-deps-{{ checksum "<< parameters.dir >>/<< parameters.lockfile >>" }}
            - v1-<< parameters.dir >>-deps-
      - run:
          name: Install & build (<< parameters.dir >>)
          command: |
            cd << parameters.dir >>
            << parameters.install_cmd >>
            << parameters.build_cmd >>
      - save_cache:
          paths:
            - ./<< parameters.dir >>/node_modules
          key: v1-<< parameters.dir >>-deps-{{ checksum "<< parameters.dir >>/<< parameters.lockfile >>" }}

jobs:
  build-and-test:
    executor: docker-executor
    steps:
      - checkout

      # Check changes
      - check_changes:
          dir: backend
      - check_changes:
          dir: dashboard
      - check_changes:
          dir: storefront

      # Backend
      - run:
          name: Build backend conditionally
          command: |
            if [ "$(cat .changed_backend)" = "true" ]; then
              echo "Building backend..."
            else
              echo "Skipping backend build."
              exit 0
            fi
      - build_and_cache_node:
          dir: backend
          lockfile: yarn.lock
          install_cmd: yarn install --frozen-lockfile
          build_cmd: yarn build

      # Dashboard
      - run:
          name: Build dashboard conditionally
          command: |
            if [ "$(cat .changed_dashboard)" = "true" ]; then
              echo "Building dashboard..."
            else
              echo "Skipping dashboard build."
              exit 0
            fi
      - build_and_cache_node:
          dir: dashboard
          lockfile: package-lock.json
          install_cmd: npm ci
          build_cmd: npm run build

      # # Storefront
      # - run:
      #     name: Build storefront conditionally
      #     command: |
      #       if [ "$(cat .changed_storefront)" = "true" ]; then
      #         echo "Building storefront..."
      #       else
      #         echo "Skipping storefront build."
      #         exit 0
      #       fi
      # - build_and_cache_node:
      #     dir: storefront
      #     lockfile: package-lock.json
      #     install_cmd: npm ci
      #     build_cmd: npm run build

  docker-build-and-push:
    docker:
      - image: cimg/node:22.6
        auth:
          username: $DOCKER_USERNAME
          password: $DOCKER_PASSWORD
    steps:
      - checkout
      - setup_remote_docker

      # Backend
      - run:
          name: Docker build backend
          command: |
            if [ "$(cat .changed_backend)" = "true" ]; then
              TAG=backend-0.1.$CIRCLE_BUILD_NUM
              docker pull $DOCKER_USERNAME/liqnic-backend:latest || true
              docker build --cache-from=$DOCKER_USERNAME/liqnic-backend:latest \
                -t $DOCKER_USERNAME/liqnic-backend:$TAG ./backend
              docker push $DOCKER_USERNAME/liqnic-backend:$TAG
              docker tag $DOCKER_USERNAME/liqnic-backend:$TAG $DOCKER_USERNAME/liqnic-backend:latest
              docker push $DOCKER_USERNAME/liqnic-backend:latest
            fi

      # Dashboard
      - run:
          name: Docker build dashboard
          command: |
            if [ "$(cat .changed_dashboard)" = "true" ]; then
              TAG=dashboard-0.1.$CIRCLE_BUILD_NUM
              docker pull $DOCKER_USERNAME/liqnic-dashboard:latest || true
              docker build --cache-from=$DOCKER_USERNAME/liqnic-dashboard:latest \
                --build-arg VITE_MEDUSA_BASE=$VITE_MEDUSA_BASE \
                --build-arg VITE_MEDUSA_BACKEND_URL=$VITE_MEDUSA_BACKEND_URL \
                --build-arg VITE_MEDUSA_STOREFRONT_URL=$VITE_MEDUSA_STOREFRONT_URL \
                -t $DOCKER_USERNAME/liqnic-dashboard:$TAG ./dashboard
              docker push $DOCKER_USERNAME/liqnic-dashboard:$TAG
              docker tag $DOCKER_USERNAME/liqnic-dashboard:$TAG $DOCKER_USERNAME/liqnic-dashboard:latest
              docker push $DOCKER_USERNAME/liqnic-dashboard:latest
            fi

      # # Storefront
      # - run:
      #     name: Docker build storefront
      #     command: |
      #       if [ "$(cat .changed_storefront)" = "true" ]; then
      #         TAG=storefront-0.1.$CIRCLE_BUILD_NUM
      #         docker pull $DOCKER_USERNAME/liqnic-storefront:latest || true
      #         docker build --cache-from=$DOCKER_USERNAME/liqnic-storefront:latest \
      #           --build-arg MEDUSA_BACKEND_URL=$MEDUSA_BACKEND_URL \
      #           --build-arg NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY \
      #           --build-arg NEXT_PUBLIC_BASE_URL=$NEXT_PUBLIC_BASE_URL \
      #           --build-arg NEXT_PUBLIC_DEFAULT_REGION=$NEXT_PUBLIC_DEFAULT_REGION \
      #           -t $DOCKER_USERNAME/liqnic-storefront:$TAG ./storefront
      #         docker push $DOCKER_USERNAME/liqnic-storefront:$TAG
      #         docker tag $DOCKER_USERNAME/liqnic-storefront:$TAG $DOCKER_USERNAME/liqnic-storefront:latest
      #         docker push $DOCKER_USERNAME/liqnic-storefront:latest
      #       fi

  deploy:
    machine:
      image: ubuntu-2004:current
    resource_class: medium
    steps:
      - run:
          name: Install sshpass
          command: |
            sudo apt-get update -y
            sudo apt-get install -y sshpass

      - run:
          name: Deploy changed services to VM
          command: |
            if [ "$CIRCLE_BRANCH" = "development" ]; then
              VM_HOST=$SSH_HOST_DEV
              VM_USER=$SSH_USER
              VM_PASS=$SSH_PASSWORD_DEV
              COMPOSE_DIR="/home/docker/liqnic"
            elif [ "$CIRCLE_BRANCH" = "production" ]; then
              VM_HOST=$SSH_HOST_PROD
              VM_USER=$SSH_USER
              VM_PASS=$SSH_PASSWORD_PROD
              COMPOSE_DIR="/home/docker/liqnic"
            fi

            if [ "$(cat .changed_backend)" = "true" ]; then
              echo "Deploying backend..."
              sshpass -p "$VM_PASS" ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST "cd $COMPOSE_DIR && docker compose pull backend && docker compose up -d backend"
            fi

            if [ "$(cat .changed_dashboard)" = "true" ]; then
              echo "Deploying dashboard..."
              sshpass -p "$VM_PASS" ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST "cd $COMPOSE_DIR && docker compose pull dashboard && docker compose up -d dashboard"
            fi

            # if [ "$(cat .changed_storefront)" = "true" ]; then
            #   echo "Deploying storefront..."
            #   sshpass -p "$VM_PASS" ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST "cd $COMPOSE_DIR && docker compose pull storefront && docker compose up -d storefront"
            # fi

workflows:
  build-deploy-dev:
    when:
      equal: [ development, << pipeline.git.branch >> ]
    jobs:
      - build-and-test:
          context: liqnic-dev
      - docker-build-and-push:
          context: liqnic-dev
          requires:
            - build-and-test
      - deploy:
          context: liqnic-dev
          requires:
            - docker-build-and-push

  build-deploy-prod:
    when:
      equal: [ production, << pipeline.git.branch >> ]
    jobs:
      - build-and-test:
          context: liqnic-prod
      - docker-build-and-push:
          context: liqnic-prod
          requires:
            - build-and-test
      - deploy:
          context: liqnic-prod
          requires:
            - docker-build-and-push
