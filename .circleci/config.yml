# CircleCI Root Configuration (v22 - Final Fix)
# This configuration uses the official continuation orb for a cleaner,
# more reliable way to trigger dynamic pipelines.
version: 2.1

# This key explicitly enables Dynamic Configuration.
setup: true

# Add the official continuation orb.
orbs:
  path-filtering: circleci/path-filtering@2.0.4
  continuation: circleci/continuation@2.0.1

# Define pipeline parameters that the path-filtering orb will populate.
parameters:
  build-backend:
    type: boolean
    default: false
  build-dashboard:
    type: boolean
    default: false

workflows:
  # This workflow checks for changes and triggers the appropriate service pipeline.
  check-and-trigger:
    jobs:
      # This job runs first and sets the pipeline parameters defined above.
      - path-filtering/filter:
          name: check-changes
          mapping: |
            backend/.* build-backend true
            dashboard/.* build-dashboard true
          base-revision: main
          filters:
            branches:
              only:
                - development
                - production

      # This job will only run if the 'build-backend' parameter is true.
      # It uses the continuation orb to trigger the backend pipeline.
      - continuation/continue:
          name: trigger-backend-pipeline
          requires:
            - check-changes
          # The 'when' condition directly uses the pipeline parameter.
          when: << pipeline.parameters.build-backend >>
          # Correct parameter name is 'configuration_path'.
          configuration_path: backend/.circleci/config.yml

      # This job will only run if the 'build-dashboard' parameter is true.
      - continuation/continue:
          name: trigger-dashboard-pipeline
          requires:
            - check-changes
          when: << pipeline.parameters.build-dashboard >>
          # Correct parameter name is 'configuration_path'.
          configuration_path: dashboard/.circleci/config.yml

