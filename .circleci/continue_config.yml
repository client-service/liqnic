# CircleCI Continuation Configuration
# This file contains the main pipeline logic and is triggered by the root config.yml.
# It uses the parameters set by the path-filtering orb to conditionally run trigger jobs.
version: 2.1

orbs:
  continuation: circleci/continuation@2.0.1

# Define the pipeline parameters that will be received from the initial filter job.
parameters:
  build-backend:
    type: boolean
    default: false
  build-dashboard:
    type: boolean
    default: false

# Define separate, dedicated jobs for each pipeline trigger.
jobs:
  # This job's only purpose is to trigger the backend pipeline if its parameter is true.
  trigger-backend-pipeline:
    docker:
      - image: cimg/base:current
    steps:
      - run: echo "Checking whether to trigger the backend pipeline..."
      - when:
          condition: << pipeline.parameters.build-backend >>
          steps:
            - continuation/continue:
                configuration_path: backend/.circleci/config.yml

  # This job's only purpose is to trigger the dashboard pipeline if its parameter is true.
  trigger-dashboard-pipeline:
    docker:
      - image: cimg/base:current
    steps:
      - run: echo "Checking whether to trigger the dashboard pipeline..."
      - when:
          condition: << pipeline.parameters.build-dashboard >>
          steps:
            - continuation/continue:
                configuration_path: dashboard/.circleci/config.yml

workflows:
  # This workflow is triggered by the root config and runs the appropriate trigger job.
  trigger-service-pipelines:
    jobs:
      - trigger-backend-pipeline
      - trigger-dashboard-pipeline:
          # Run sequentially to avoid potential state conflicts.
          requires:
            - trigger-backend-pipeline

