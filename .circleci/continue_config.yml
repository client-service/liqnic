version: 2.1

# ==========================================
# 🎛️ PIPELINE PARAMETERS (From path-filtering)
# ==========================================
parameters:
  run-backend-pipeline:
    type: boolean
    default: false
  run-dashboard-pipeline:
    type: boolean
    default: false
  run-storefront-pipeline:
    type: boolean
    default: false

# ==========================================
# 📦 SHARED CONFIGURATION
# ==========================================
executors:
  node-docker:
    docker:
      - image: cimg/node:24.14.1
  deploy-machine:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium # Optional: remove if using amd64 on CircleCI

commands:
  install-monorepo-deps:
    description: "Install dependencies strictly using pnpm workspaces"
    steps:
      - restore_cache:
          keys:
            - v1-pnpm-deps-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: "Strict pnpm Install"
          command: sudo corepack enable && pnpm install --frozen-lockfile
      - save_cache:
          key: v1-pnpm-deps-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - backend/node_modules
            - dashboard/node_modules
            - storefront/node_modules

jobs:
  # ====================================================================
  # ==                         BACKEND JOBS                           ==
  # ====================================================================
  build-test-backend:
    executor: node-docker
    steps:
      - checkout
      - install-monorepo-deps
      - run:
          name: Build Backend
          command: pnpm --filter=backend build

  docker-publish-backend:
    executor: node-docker
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and Push Backend Image (Root Context)
          command: |
            ENV_TAG=$([ "$CIRCLE_BRANCH" = "production" ] && echo "prod" || echo "dev")
            UNIQUE_TAG="$ENV_TAG-${CIRCLE_SHA1:0:7}"

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            # Note the '.' at the end! It builds from the root to read pnpm-lock.yaml
            docker build -f backend/Dockerfile -t "$DOCKER_USERNAME/liqnic-backend:$UNIQUE_TAG" .
            docker tag "$DOCKER_USERNAME/liqnic-backend:$UNIQUE_TAG" "$DOCKER_USERNAME/liqnic-backend:$ENV_TAG"
            docker push --all-tags "$DOCKER_USERNAME/liqnic-backend"

  deploy-backend:
    executor: deploy-machine
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:bu4d5JVl8kARC8wsDVC72vhPvS2ZlRUFjb/PAhyvb+U"
      - run:
          name: Zero-Downtime Deploy Backend
          command: |
            ENV_TAG=$([ "$CIRCLE_BRANCH" = "production" ] && echo "prod" || echo "dev")
            export BACKEND_VERSION="$ENV_TAG-${CIRCLE_SHA1:0:7}"
            DEPLOY_PATH="/home/docker/liqnic/$ENV_TAG"

            # Ship the repo-owned compose file for this environment (repo is the source of truth).
            # Falls back to the existing server compose if no repo file exists yet for this env (e.g. prod).
            if [ -f "deploy/docker-compose.$ENV_TAG.yml" ]; then
              scp -o StrictHostKeyChecking=no "deploy/docker-compose.$ENV_TAG.yml" $SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml
            else
              echo "==> No repo compose for $ENV_TAG; using existing server compose."
            fi
            # restart.sh isn't env-specific -- always ship it, regardless of whether
            # an env-specific compose file exists yet.
            scp -o StrictHostKeyChecking=no "deploy/restart.sh" $SSH_USER@$SSH_HOST:$DEPLOY_PATH/restart.sh

            ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
              set -e
              cd $DEPLOY_PATH
              touch .env
              grep -v '^BACKEND_VERSION=' .env > .env.tmp || true
              echo 'BACKEND_VERSION=$BACKEND_VERSION' >> .env.tmp
              mv .env.tmp .env
              docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
              docker compose pull backend
              docker compose up -d --remove-orphans backend
              docker image prune -f --filter until=24h
              echo '==> Backend deployment complete!'
            "

  # ====================================================================
  # ==                        DASHBOARD JOBS                          ==
  # ====================================================================
  build-test-dashboard:
    executor: node-docker
    steps:
      - checkout
      - install-monorepo-deps
      - run:
          name: Build Dashboard
          command: pnpm --filter=@medusajs/dashboard build

  docker-publish-dashboard:
    executor: node-docker
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and Push Dashboard Image (Root Context)
          command: |
            ENV_TAG=$([ "$CIRCLE_BRANCH" = "production" ] && echo "prod" || echo "dev")
            UNIQUE_TAG="$ENV_TAG-${CIRCLE_SHA1:0:7}"

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            # Pass build arguments explicitly
            docker build \
              -f dashboard/Dockerfile \
              --build-arg VITE_MEDUSA_BACKEND_URL=$MEDUSA_BACKEND_URL \
              --build-arg VITE_MEDUSA_BASE=$VITE_MEDUSA_BASE \
              --build-arg VITE_MEDUSA_STOREFRONT_URL=$NEXT_PUBLIC_BASE_URL \
              -t "$DOCKER_USERNAME/liqnic-dashboard:$UNIQUE_TAG" .

            docker tag "$DOCKER_USERNAME/liqnic-dashboard:$UNIQUE_TAG" "$DOCKER_USERNAME/liqnic-dashboard:$ENV_TAG"
            docker push --all-tags "$DOCKER_USERNAME/liqnic-dashboard"

  deploy-dashboard:
    executor: deploy-machine
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:bu4d5JVl8kARC8wsDVC72vhPvS2ZlRUFjb/PAhyvb+U"

      - run:
          name: Zero-Downtime Deploy Dashboard
          command: |
            ENV_TAG=$([ "$CIRCLE_BRANCH" = "production" ] && echo "prod" || echo "dev")
            export DASHBOARD_VERSION="$ENV_TAG-${CIRCLE_SHA1:0:7}"
            DEPLOY_PATH="/home/docker/liqnic/$ENV_TAG"

            # Ship the repo-owned compose file for this environment (repo is the source of truth).
            # Falls back to the existing server compose if no repo file exists yet for this env (e.g. prod).
            if [ -f "deploy/docker-compose.$ENV_TAG.yml" ]; then
              scp -o StrictHostKeyChecking=no "deploy/docker-compose.$ENV_TAG.yml" $SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml
            else
              echo "==> No repo compose for $ENV_TAG; using existing server compose."
            fi
            # restart.sh isn't env-specific -- always ship it, regardless of whether
            # an env-specific compose file exists yet.
            scp -o StrictHostKeyChecking=no "deploy/restart.sh" $SSH_USER@$SSH_HOST:$DEPLOY_PATH/restart.sh

            ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
              set -e
              cd $DEPLOY_PATH
              touch .env
              grep -v '^DASHBOARD_VERSION=' .env > .env.tmp || true
              echo 'DASHBOARD_VERSION=$DASHBOARD_VERSION' >> .env.tmp
              mv .env.tmp .env
              docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
              docker compose pull dashboard

              echo '==> Checking Backend Health Status...'
              for i in {1..30}; do
                # Get the health status, ignore errors if it doesn't exist yet
                STATUS=\$(docker inspect -f '{{.State.Health.Status}}' liqnic-backend-\$ENV_TAG 2>/dev/null || echo \"missing\")

                if [ \"\$STATUS\" = \"healthy\" ] || [ \"\$STATUS\" = \"missing\" ]; then
                  echo '==> Backend is healthy! Proceeding with dashboard deployment...'
                  break
                fi

                echo \"==> Backend is currently \$STATUS. Waiting 10 seconds... (\$i/30)\"
                sleep 10
              done

              # Now it is safe to deploy the dashboard
              docker compose up -d --remove-orphans dashboard
              nohup docker image prune -f --filter until=24h > /dev/null 2>&1 &
              echo '==> Dashboard deployment complete!'
            "

  # ====================================================================
  # ==                       STOREFRONT JOBS                          ==
  # ====================================================================
  build-test-storefront:
    executor: node-docker
    steps:
      - checkout
      - install-monorepo-deps
      - run:
          name: Build Storefront
          command: |
            # Inject build-time environment variables for Next.js
            echo "MEDUSA_BACKEND_URL=${MEDUSA_BACKEND_URL}" > storefront/.env
            echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}" >> storefront/.env
            echo "NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}" >> storefront/.env

            pnpm --filter=medusa-next build

  docker-publish-storefront:
    executor: node-docker
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and Push Storefront Image (Root Context)
          command: |
            ENV_TAG=$([ "$CIRCLE_BRANCH" = "production" ] && echo "prod" || echo "dev")
            UNIQUE_TAG="$ENV_TAG-${CIRCLE_SHA1:0:7}"

            # Inject build-time environment variables for Docker Next.js build.
            # Written to repo root (not storefront/.env) — storefront/Dockerfile:21 does
            # `COPY .env ./storefront/.env` from the build context root.
            echo "MEDUSA_BACKEND_URL=${MEDUSA_BACKEND_URL}" > .env
            echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}" >> .env
            echo "NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}" >> .env

            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            # Build from Root
            docker build -f storefront/Dockerfile -t "$DOCKER_USERNAME/liqnic-storefront:$UNIQUE_TAG" .
            docker tag "$DOCKER_USERNAME/liqnic-storefront:$UNIQUE_TAG" "$DOCKER_USERNAME/liqnic-storefront:$ENV_TAG"
            docker push --all-tags "$DOCKER_USERNAME/liqnic-storefront"

  deploy-storefront:
    executor: deploy-machine
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:bu4d5JVl8kARC8wsDVC72vhPvS2ZlRUFjb/PAhyvb+U"

      - run:
          name: Zero-Downtime Deploy Storefront
          command: |
            ENV_TAG=$([ "$CIRCLE_BRANCH" = "production" ] && echo "prod" || echo "dev")
            export STOREFRONT_VERSION="$ENV_TAG-${CIRCLE_SHA1:0:7}"
            DEPLOY_PATH="/home/docker/liqnic/$ENV_TAG"

            # Ship the repo-owned compose file for this environment (repo is the source of truth).
            # Falls back to the existing server compose if no repo file exists yet for this env (e.g. prod).
            if [ -f "deploy/docker-compose.$ENV_TAG.yml" ]; then
              scp -o StrictHostKeyChecking=no "deploy/docker-compose.$ENV_TAG.yml" $SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml
            else
              echo "==> No repo compose for $ENV_TAG; using existing server compose."
            fi
            # restart.sh isn't env-specific -- always ship it, regardless of whether
            # an env-specific compose file exists yet.
            scp -o StrictHostKeyChecking=no "deploy/restart.sh" $SSH_USER@$SSH_HOST:$DEPLOY_PATH/restart.sh

            ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
              set -e
              cd $DEPLOY_PATH
              touch .env
              grep -vE '^(STOREFRONT_VERSION|REVALIDATE_SECRET)=' .env > .env.tmp || true
              echo 'STOREFRONT_VERSION=$STOREFRONT_VERSION' >> .env.tmp
              echo 'REVALIDATE_SECRET=$REVALIDATE_SECRET' >> .env.tmp
              mv .env.tmp .env
              docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
              docker compose pull storefront

              echo '==> Checking Backend Health Status...'
              for i in {1..30}; do
                # Get the health status, ignore errors if it doesn't exist yet
                STATUS=\$(docker inspect -f '{{.State.Health.Status}}' liqnic-backend-\$ENV_TAG 2>/dev/null || echo \"missing\")

                if [ \"\$STATUS\" = \"healthy\" ] || [ \"\$STATUS\" = \"missing\" ]; then
                  echo '==> Backend is healthy! Proceeding with storefront deployment...'
                  break
                fi

                echo \"==> Backend is currently \$STATUS. Waiting 10 seconds... (\$i/30)\"
                sleep 10
              done

              # Now it is safe to deploy the storefront
              docker compose up -d --remove-orphans storefront
              nohup docker image prune -f --filter until=24h > /dev/null 2>&1 &
              echo '==> Storefront deployment complete!'
            "

# ====================================================================
# ==                         WORKFLOWS                            ==
# ====================================================================
workflows:
  # Each service workflow is split per-branch so `liqnic-dev` and `liqnic-prod`
  # are never both attached to the same job. CircleCI resolves duplicate
  # variable names across contexts using the LAST-listed context, so
  # `context: [liqnic-dev, liqnic-prod]` on every branch (the old shape) meant
  # liqnic-prod always won -- dev builds silently got prod's MEDUSA_BACKEND_URL,
  # NEXT_PUBLIC_BASE_URL, etc. baked in. Branch-level `when` here replaces the
  # old per-job `filters: { branches: ... } }`, which is now redundant.
  backend-workflow-dev:
    when:
      and:
        - << pipeline.parameters.run-backend-pipeline >>
        - equal: [development, << pipeline.git.branch >>]
    jobs:
      - build-test-backend
      - docker-publish-backend:
          context: [liqnic-dev]
          requires: [build-test-backend]
      - deploy-backend:
          context: [liqnic-dev]
          requires: [docker-publish-backend]

  backend-workflow-prod:
    when:
      and:
        - << pipeline.parameters.run-backend-pipeline >>
        - equal: [production, << pipeline.git.branch >>]
    jobs:
      - build-test-backend
      - docker-publish-backend:
          context: [liqnic-prod]
          requires: [build-test-backend]
      - deploy-backend:
          context: [liqnic-prod]
          requires: [docker-publish-backend]

  dashboard-workflow-dev:
    when:
      and:
        - << pipeline.parameters.run-dashboard-pipeline >>
        - equal: [development, << pipeline.git.branch >>]
    jobs:
      - build-test-dashboard
      - docker-publish-dashboard:
          context: [liqnic-dev]
          requires: [build-test-dashboard]
      - deploy-dashboard:
          context: [liqnic-dev]
          requires: [docker-publish-dashboard]

  dashboard-workflow-prod:
    when:
      and:
        - << pipeline.parameters.run-dashboard-pipeline >>
        - equal: [production, << pipeline.git.branch >>]
    jobs:
      - build-test-dashboard
      - docker-publish-dashboard:
          context: [liqnic-prod]
          requires: [build-test-dashboard]
      - deploy-dashboard:
          context: [liqnic-prod]
          requires: [docker-publish-dashboard]

  storefront-workflow-dev:
    when:
      and:
        - << pipeline.parameters.run-storefront-pipeline >>
        - equal: [development, << pipeline.git.branch >>]
    jobs:
      - build-test-storefront:
          context: [liqnic-dev]
      - docker-publish-storefront:
          context: [liqnic-dev]
          requires: [build-test-storefront]
      - deploy-storefront:
          context: [liqnic-dev]
          requires: [docker-publish-storefront]

  storefront-workflow-prod:
    when:
      and:
        - << pipeline.parameters.run-storefront-pipeline >>
        - equal: [production, << pipeline.git.branch >>]
    jobs:
      - build-test-storefront:
          context: [liqnic-prod]
      - docker-publish-storefront:
          context: [liqnic-prod]
          requires: [build-test-storefront]
      - deploy-storefront:
          context: [liqnic-prod]
          requires: [docker-publish-storefront]
