server {
    listen 80;
    server_name localhost;  # or your domain.com

    root /usr/share/nginx/html; # or wherever your React build is
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Optional: Serve static assets correctly
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|otf|eot|json)$ {
        expires max;
        log_not_found off;
    }

    error_page 404 /index.html;
}
