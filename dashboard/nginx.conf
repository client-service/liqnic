server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # Fix for Vite's .mjs files
    location / {
        try_files $uri $uri/ /index.html;
    }

    types {
        application/javascript mjs;
        text/css css;
        text/html html;
        application/json json;
        image/png png;
        image/jpeg jpeg;
        image/gif gif;
        # Add any other MIME types you need
    }

    # Cache headers (optional, adjust as needed)
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|woff2|woff|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }
}
